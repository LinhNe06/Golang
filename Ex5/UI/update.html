<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Order</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="container">
        <section class="card">
            <a class="back-link" href="index.html">← Back to menu</a>
            <h1>Update Order</h1>
            <p class="subtitle">Cập nhật thông tin đơn hàng theo ID.</p>

            <form id="updateForm">
                <label for="order_id">Order ID</label>
                <input type="text" id="order_id" required />

                <label for="user_id">User ID</label>
                <input type="text" id="user_id" required />

                <label for="product_name">Product Name</label>
                <input type="text" id="product_name" required />

                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" min="1" required />

                <label for="price">Price</label>
                <input type="number" id="price" min="0" step="0.01" required />

                <div class="actions">
                    <button type="submit">Update Order</button>
                </div>
            </form>

            <pre id="result"></pre>
        </section>
    </main>

    <script src="api.js"></script>

    <script>
        document.getElementById("updateForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const id = document.getElementById("order_id").value;
            const data = {
            user_id: document.getElementById("user_id").value,
            product_name: document.getElementById("product_name").value,
            quantity: parseInt(document.getElementById("quantity").value),
            price: parseFloat(document.getElementById("price").value),
            };
            updateOrder(id, data);
        });
    </script>
</body>
</html>
